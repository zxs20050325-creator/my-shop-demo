# Render 部署配置（Blueprint）
# 只部署一个后端 Web 服务，前端由后端同一服务托管（避免跨域）
services:
  - type: web
    name: jiyi-zhumeng
    runtime: node
    plan: free
    nodeVersion: 18.18.0
    repo: https://github.com/zxs20050325-creator/my-shop-demo.git
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DB_PATH
        value: ./jiyi.db
      - key: NODE_ENV
        value: production