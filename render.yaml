services:
  - type: web
    name: jiyi-zhumeng
    runtime: node
    plan: free
    repo: https://github.com/zxs20050325-creator/my-shop-demo.git
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && cd ../frontend && npm ci --include=dev && npm run build && test -f dist/index.html
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGIN
        sync: false
